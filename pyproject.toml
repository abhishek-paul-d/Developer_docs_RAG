[project]
name = "devdocs-rag"
version = "0.1.0"
description = "Developer docs assistant: a measured RAG system with a fine-tuned generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
data = [
    "polars==2.0.0",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "pre-commit>=3.7",
]
experiments = [
    "langchain-text-splitters>=1.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devdocs_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.uv]
default-groups = ["dev", "data"]
